[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_port = COM6
monitor_rts = 0
monitor_dtr = 0

; If you are using a different ESP32 camera board, change the board name above.
; This project keeps the Arduino sketch in the project root.

lib_deps = 
    espressif/esp32-camera @ ^2.0.4